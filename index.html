    <script>
      (function() {
        try {
          var bridge = window.IGseekNativeBridge;
          var persistKeys = [
            'igseek:clean_slate_v6',
            'igseek:local_user',
            'igseek:accounts_v1',
            'igseek:local_db:profiles',
            'igseek:has_logged_in',
            'igseek:cloud_uid',
            'igseek:lang',
            'igseek:theme',
            'igseek:accent'
          ];
          if (bridge && typeof bridge.getItem === 'function') {
            for (var bi = 0; bi < persistKeys.length; bi++) {
              var pk = persistKeys[bi];
              try {
                if (!localStorage.getItem(pk)) {
                  var bVal = bridge.getItem(pk);
                  if (bVal) localStorage.setItem(pk, bVal);
                }
              } catch (e) {}
            }
          }
          try {
            var cookieMatch = document.cookie.match(/(?:^|;\s*)igseek_sess_v1=([^;]+)/);
            if (cookieMatch && cookieMatch[1]) {
              var parsedSess = JSON.parse(decodeURIComponent(cookieMatch[1]));
              if (parsedSess && parsedSess.v) {
                if (!localStorage.getItem('igseek:clean_slate_v6')) {
                  localStorage.setItem('igseek:clean_slate_v6', '1');
                }
                if (parsedSess.u && !localStorage.getItem('igseek:local_user')) {
                  localStorage.setItem('igseek:local_user', JSON.stringify(parsedSess.u));
                }
                if (parsedSess.h && !localStorage.getItem('igseek:has_logged_in')) {
                  localStorage.setItem('igseek:has_logged_in', '1');
                }
              }
            }
          } catch (e) {}

          if (!localStorage.getItem('igseek:clean_slate_v6')) {
            window.__igseekCleanSlateAuthReset = true;
            var keys = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (
                k &&
                (k.indexOf('igseek:') === 0 ||
                  k.indexOf('firebase:') === 0 ||
                  k.indexOf('supabase') !== -1 ||
                  k.indexOf('sb-') !== -1)
              ) {
                keys.push(k);
              }
            }
            keys.forEach(function(k) { localStorage.removeItem(k); });
            try { sessionStorage.clear(); } catch (e) {}
            localStorage.setItem('igseek:clean_slate_v6', '1');
            localStorage.setItem('igseek:lang', 'en');
            localStorage.setItem('igseek:theme', 'light');
            if (bridge && typeof bridge.setItem === 'function') {
              try { bridge.setItem('igseek:clean_slate_v6', '1'); } catch (e) {}
            }
          }
          var lang = localStorage.getItem('igseek:lang') || 'en';
          var doc = document.documentElement;
          doc.lang = lang;
          doc.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var t = localStorage.getItem('igseek:theme') || 'light';
          if (t === 'dark') {
            doc.classList.add('dark');
            doc.classList.remove('light');
          } else {
            doc.classList.add('light');
            doc.classList.remove('dark');
          }
          doc.style.colorScheme = t;
          var a = localStorage.getItem('igseek:accent') || 'default';
          var presets = {
            default: { dark: '#ef4444', light: '#18181b', filter: 'none', soft: 'rgba(239, 68, 68, 0.15)', border: 'rgba(239, 68, 68, 0.35)', activeBg: '#381016', bubbleBg: '#3a131a', shadow: '0 0 16px rgba(239, 68, 68, 0.28)', glow: 'rgba(239, 68, 68, 0.45)', lightSoft: 'rgba(24, 24, 27, 0.08)', lightBorder: 'rgba(24, 24, 27, 0.18)', lightShadow: '0 4px 12px rgba(0, 0, 0, 0.1)', lightGlow: 'rgba(0, 0, 0, 0.15)' },
            red: { dark: '#ef4444', light: '#dc2626', filter: 'none', soft: 'rgba(239, 68, 68, 0.15)', border: 'rgba(239, 68, 68, 0.35)', activeBg: '#381016', bubbleBg: '#3a131a', shadow: '0 0 16px rgba(239, 68, 68, 0.28)', glow: 'rgba(239, 68, 68, 0.45)', lightSoft: 'rgba(220, 38, 38, 0.10)', lightBorder: 'rgba(220, 38, 38, 0.28)', lightShadow: '0 4px 14px rgba(220, 38, 38, 0.20)', lightGlow: 'rgba(220, 38, 38, 0.30)' },
            orange: { dark: '#f97316', light: '#ea580c', filter: 'hue-rotate(28deg) saturate(1.35) brightness(1.05)', soft: 'rgba(249, 115, 22, 0.16)', border: 'rgba(249, 115, 22, 0.38)', activeBg: '#3a1c0d', bubbleBg: '#3d2011', shadow: '0 0 16px rgba(249, 115, 22, 0.32)', glow: 'rgba(249, 115, 22, 0.48)', lightSoft: 'rgba(234, 88, 12, 0.10)', lightBorder: 'rgba(234, 88, 12, 0.28)', lightShadow: '0 4px 14px rgba(234, 88, 12, 0.20)', lightGlow: 'rgba(234, 88, 12, 0.30)' },
            black: { dark: '#71717a', light: '#18181b', filter: 'grayscale(1) brightness(0.75)', soft: 'rgba(113, 113, 122, 0.15)', border: 'rgba(113, 113, 122, 0.35)', activeBg: '#27272a', bubbleBg: '#27272a', shadow: '0 0 16px rgba(113, 113, 122, 0.28)', glow: 'rgba(113, 113, 122, 0.45)', lightSoft: 'rgba(24, 24, 27, 0.08)', lightBorder: 'rgba(24, 24, 27, 0.18)', lightShadow: '0 4px 12px rgba(0, 0, 0, 0.1)', lightGlow: 'rgba(0, 0, 0, 0.15)' },
            emerald: { dark: '#10b981', light: '#059669', filter: 'hue-rotate(130deg) saturate(1.2) brightness(0.95)', soft: 'rgba(16, 185, 129, 0.15)', border: 'rgba(16, 185, 129, 0.35)', activeBg: '#0b2e20', bubbleBg: '#0d3424', shadow: '0 0 16px rgba(16, 185, 129, 0.28)', glow: 'rgba(16, 185, 129, 0.45)', lightSoft: 'rgba(5, 150, 105, 0.10)', lightBorder: 'rgba(5, 150, 105, 0.28)', lightShadow: '0 4px 14px rgba(5, 150, 105, 0.20)', lightGlow: 'rgba(5, 150, 105, 0.30)' },
            blue: { dark: '#3b82f6', light: '#2563eb', filter: 'hue-rotate(215deg) saturate(1.3) brightness(1.05)', soft: 'rgba(59, 130, 246, 0.15)', border: 'rgba(59, 130, 246, 0.35)', activeBg: '#0f2240', bubbleBg: '#112749', shadow: '0 0 16px rgba(59, 130, 246, 0.28)', glow: 'rgba(59, 130, 246, 0.45)', lightSoft: 'rgba(37, 99, 235, 0.10)', lightBorder: 'rgba(37, 99, 235, 0.28)', lightShadow: '0 4px 14px rgba(37, 99, 235, 0.20)', lightGlow: 'rgba(37, 99, 235, 0.30)' },
            purple: { dark: '#8b5cf6', light: '#7c3aed', filter: 'hue-rotate(260deg) saturate(1.4) brightness(1.1)', soft: 'rgba(139, 92, 246, 0.15)', border: 'rgba(139, 92, 246, 0.35)', activeBg: '#231238', bubbleBg: '#291642', shadow: '0 0 16px rgba(139, 92, 246, 0.28)', glow: 'rgba(139, 92, 246, 0.45)', lightSoft: 'rgba(124, 58, 237, 0.10)', lightBorder: 'rgba(124, 58, 237, 0.28)', lightShadow: '0 4px 14px rgba(124, 58, 237, 0.20)', lightGlow: 'rgba(124, 58, 237, 0.30)' },
            pink: { dark: '#ec4899', light: '#db2777', filter: 'hue-rotate(320deg) saturate(1.3) brightness(1.05)', soft: 'rgba(236, 72, 153, 0.15)', border: 'rgba(236, 72, 153, 0.35)', activeBg: '#390f23', bubbleBg: '#421229', shadow: '0 0 16px rgba(236, 72, 153, 0.28)', glow: 'rgba(236, 72, 153, 0.45)', lightSoft: 'rgba(219, 39, 119, 0.10)', lightBorder: 'rgba(219, 39, 119, 0.28)', lightShadow: '0 4px 14px rgba(219, 39, 119, 0.20)', lightGlow: 'rgba(219, 39, 119, 0.30)' },
            amber: { dark: '#f59e0b', light: '#d97706', filter: 'hue-rotate(42deg) saturate(1.5) brightness(1.1)', soft: 'rgba(245, 158, 11, 0.15)', border: 'rgba(245, 158, 11, 0.35)', activeBg: '#362106', bubbleBg: '#3d2608', shadow: '0 0 16px rgba(245, 158, 11, 0.28)', glow: 'rgba(245, 158, 11, 0.45)', lightSoft: 'rgba(217, 119, 6, 0.10)', lightBorder: 'rgba(217, 119, 6, 0.28)', lightShadow: '0 4px 14px rgba(217, 119, 6, 0.20)', lightGlow: 'rgba(217, 119, 6, 0.30)' }
          };
          var p = presets[a] || presets.default;
          var isLight = t === 'light';
          var color = isLight ? p.light : p.dark;
          var soft = isLight ? p.lightSoft : p.soft;
          var border = isLight ? p.lightBorder : p.border;
          var activeBg = isLight ? p.light : p.activeBg;
          var bubbleBg = isLight ? p.light : p.bubbleBg;
          var shadow = isLight ? p.lightShadow : p.shadow;
          var glow = isLight ? p.lightGlow : p.glow;
          var logoFilter = (isLight && (a === 'default' || a === 'black')) ? 'brightness(0)' : p.filter;
          doc.style.setProperty('--brand', color);
          doc.style.setProperty('--brand-glow', color);
          doc.style.setProperty('--brand-soft', soft);
          doc.style.setProperty('--brand-border', border);
          doc.style.setProperty('--brand-active-bg', activeBg);
          doc.style.setProperty('--brand-bubble-bg', bubbleBg);
          doc.style.setProperty('--brand-shadow', shadow);
          doc.style.setProperty('--brand-glow-shadow', glow);
          doc.style.setProperty('--logo-filter', logoFilter);
          doc.style.setProperty('--primary', color);
          doc.style.setProperty('--ring', color);
        } catch(e) {}
      })();
    </script>
  </head>
